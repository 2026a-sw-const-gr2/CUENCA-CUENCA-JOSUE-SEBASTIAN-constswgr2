<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cafetería CRUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="header">

            <img src="img/logo.png" alt="Logo Cafetería" class="logo">

            <h1>Sistema de Gestión de Cafetería</h1>

    </div>

        <form id="productForm">

            <input type="text" id="nombre" placeholder="Nombre del producto" required>

            <input type="text" id="categoria" placeholder="Categoría" required>

            <input type="number" step="0.01" id="precio" placeholder="Precio" required>

            <input type="number" id="stock" placeholder="Stock" required>

            <button type="submit">Guardar Producto</button>

        </form>

        <h2>Productos</h2>

        <input type="text" id="searchInput" placeholder="Buscar producto...">

        <div id="productList"></div>

    </div>

    <script src="app.js"></script>

</body>
</html>
